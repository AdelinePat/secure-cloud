services:
  gateway:
    depends_on:
      auth:
        condition: service_started
      messaging:
        condition: service_started
      file:
        condition: service_started
      audit:
        condition: service_started
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT}
      AUTH_HOST: auth
      AUTH_PORT: ${AUTH_PORT}
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - type: bind
        source: ./certs/ca/ca.crt
        target: /app/certs/ca/ca.crt
      - type: bind
        source: ./certs/gateway
        target: /app/certs/gateway
      - type: bind
        source: ./gateway
        target: /app/gateway
      - type: bind
        source: ./secureChat.sh
        target: /app/secureChat.sh
    command: [ "bash", "./secureChat.sh", "run", "gateway" ]

  # One-shot: creates the JWT key pair on first start (empty auth-keys volume)
  # and publishes the public key to jwt-public. Re-runs on every `up`, keeps
  # an existing private key.
  jwt-keys:
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "sh", "/tools/ensure-jwt-keys.sh", "/keys/auth", "/keys/public" ]
    restart: "no"
    volumes:
      - type: bind
        source: ./tools/ensure-jwt-keys.sh
        target: /tools/ensure-jwt-keys.sh
        read_only: true
      - type: volume
        source: auth-keys
        target: /keys/auth
      - type: volume
        source: jwt-public
        target: /keys/public

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      jwt-keys:
        condition: service_completed_successfully
      app-db:
        condition: service_healthy
    environment:
      AUTH_PORT: ${AUTH_PORT}
      DB_HOST: "app-db"
      DB_PORT: ${DB_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_DATA}
      AUTH_DATABASE_URL: "host=app-db port=${DB_PORT} dbname=${POSTGRES_DB_DATA} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD}"
      AUTH_JWT_PRIVATE_KEY_PATH: "/app/auth-keys/private.pem"
      AUTH_JWT_PUBLIC_KEY_PATH: "/app/auth-keys/public.pem"
      AUDIT_ENABLED: "true"
      AUDIT_URL: "https://audit:8085"
      AUDIT_SERVICE_NAME: "auth"
      AUDIT_TLS_CERT: "/app/certs/auth/auth.crt"
      AUDIT_TLS_KEY: "/app/certs/auth/auth.key"
      AUDIT_TLS_CA: "/app/certs/ca/ca.crt"
      AUDIT_SPOOL_DIR: "/app/audit-spool/auth"
    volumes:
      - type: bind
        source: ./certs/ca/ca.crt
        target: /app/certs/ca/ca.crt
      - type: bind
        source: ./certs/auth
        target: /app/certs/auth
      - type: bind
        source: ./common
        target: /app/common
      - type: bind
        source: ./auth
        target: /app/auth
      - type: bind
        source: ./secureChat.sh
        target: /app/secureChat.sh
      - type: volume
        source: auth-keys
        target: /app/auth-keys
      - type: volume
        source: audit-spool
        target: /app/audit-spool
    command: [ "bash", "./secureChat.sh", "run", "auth" ]

  messaging:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: "app-db"
      DB_PORT: ${DB_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_DATA}
      MESSAGING_JWT_PUBLIC_KEY_PATH: "/app/jwt/public.pem"
      AUDIT_ENABLED: "true"
      AUDIT_URL: "https://audit:8085"
      AUDIT_SERVICE_NAME: "messaging"
      AUDIT_TLS_CERT: "/app/certs/messaging/messaging.crt"
      AUDIT_TLS_KEY: "/app/certs/messaging/messaging.key"
      AUDIT_TLS_CA: "/app/certs/ca/ca.crt"
      AUDIT_SPOOL_DIR: "/app/audit-spool/messaging"
    depends_on:
      jwt-keys:
        condition: service_completed_successfully
      app-db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./certs/ca/ca.crt
        target: /app/certs/ca/ca.crt
      # Public key only (published by jwt-keys); the private key stays in
      # auth-keys, which is mounted into auth alone.
      - type: volume
        source: jwt-public
        target: /app/jwt
        read_only: true
      - type: bind
        source: ./certs/messaging
        target: /app/certs/messaging
      - type: bind
        source: ./common
        target: /app/common
      - type: bind
        source: ./messaging
        target: /app/messaging
      - type: bind
        source: ./secureChat.sh
        target: /app/secureChat.sh
      - type: volume
        source: audit-spool
        target: /app/audit-spool
    command: [ "bash", "./secureChat.sh", "run", "messaging" ]

  file:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      app-db:
        condition: service_healthy
    environment:
      DB_HOST: "app-db"
      DB_PORT: ${DB_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_DATA}
    volumes:
      - type: bind
        source: ./certs/ca/ca.crt
        target: /app/certs/ca/ca.crt
      - type: bind
        source: ./certs/file
        target: /app/certs/file
      - type: bind
        source: ./file
        target: /app/file
      - type: bind
        source: ./secureChat.sh
        target: /app/secureChat.sh
      - type: volume
        source: file-storage
        target: /app/file-storage
    command: [ "bash", "./secureChat.sh", "run", "file" ]

  audit:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      audit-db:
        condition: service_healthy
    environment:
      MONGO_HOST: "audit-db"
      MONGO_PORT: ${AUDIT_DB_PORT}
      MONGO_DB: ${MONGO_DB_AUDIT}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_AUTH_SOURCE: ${MONGO_DB_AUDIT}
      AUDIT_PORT: ${AUDIT_PORT}
      AUDIT_TLS_ENABLED: "true"
      AUDIT_TLS_CERT: /app/certs/audit/audit.crt
      AUDIT_TLS_KEY: /app/certs/audit/audit.key
      AUDIT_TLS_CA: /app/certs/ca/ca.crt
      AUDIT_ALLOWED_SERVICES: "auth,file,messaging,gateway"
    expose:
      - "${AUDIT_PORT}"
    volumes:
      - type: bind
        source: ./certs/ca/ca.crt
        target: /app/certs/ca/ca.crt
      - type: bind
        source: ./certs/audit
        target: /app/certs/audit
      - type: bind
        source: ./audit
        target: /app/audit
      - type: bind
        source: ./secureChat.sh
        target: /app/secureChat.sh
    command: [ "bash", "./secureChat.sh", "run", "audit" ]

  app-db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB_DATA}
    volumes:
      - type: volume
        source: app-data
        target: /var/lib/postgresql
      - type: bind
        source: ./auth/db/0001_auth_init.sql
        target: /docker-entrypoint-initdb.d/01_auth_init.sql
      - type: bind
        source: ./file/db/0001_file_init.sql
        target: /docker-entrypoint-initdb.d/02_file_init.sql
      - type: bind
        source: ./messaging/db/0001_messaging_init.sql
        target: /docker-entrypoint-initdb.d/03_messaging_init.sql
      - type: bind
        source: ./auth/db/auth_seed.sql
        target: /docker-entrypoint-initdb.d/04_auth_seed.sql
      - type: bind
        source: ./queries.sql # host: project-root/queries.sql (unchanged, still where it is now)
        target: /scratch/queries.sql # container: brand-new path, only exists inside app-db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5

  audit-db:
    image: mongo:8.3.11-noble
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_DB_AUDIT: ${MONGO_DB_AUDIT}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - type: volume
        source: audit-data
        target: /data/db
      - type: bind
        source: ./audit-db-init.js
        target: /docker-entrypoint-initdb.d/mongo-init.js
        read_only: true
      - type: bind
        source: ./queries.js
        target: /queries.js
    healthcheck:
      test: [ "CMD", "mongosh", "-u", "${MONGO_INITDB_ROOT_USERNAME}", "-p", "${MONGO_INITDB_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  app-data:
  audit-data:
  audit-spool:
  auth-keys:
  jwt-public:
  file-storage:
