services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: securechat_test
      POSTGRES_DB: securechat_test
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ../../app-db-init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "securechat_test", "-d", "securechat_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  backend:
    build:
      context: ../..
    depends_on:
      db:
        condition: service_healthy
    environment:
      AUTH_HOST: 127.0.0.1
      AUTH_PORT: 8081
      MESSAGING_HOST: 127.0.0.1
      MESSAGING_PORT: 8082
      GATEWAY_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: securechat_test
      POSTGRES_PASSWORD: ""
      POSTGRES_DB: securechat_test
      AUTH_DATABASE_URL: host=db port=5432 dbname=securechat_test user=securechat_test
      AUTH_JWT_PRIVATE_KEY_PATH: /tmp/securechat-jwt/private.pem
      AUTH_JWT_PUBLIC_KEY_PATH: /tmp/securechat-jwt/public.pem
      MESSAGING_JWT_PUBLIC_KEY_PATH: /tmp/securechat-jwt/public.pem
      AUDIT_ENABLED: "false"
    volumes:
      - ../..:/app:ro
    ports:
      - "127.0.0.1::8080"
    command: ["bash", "/app/tests/security/start-backend.sh"]
